<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gemini Reply Generator</title>
  <style>
    body {
      width: 200px;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      color: #14171a;
      margin: 0;
    }
    
    .container {
      display: flex;
      flex-direction: column;
    }
    
    .header {
      background: linear-gradient(135deg, #1DA1F2, #0c85d0);
      color: white;
      padding: 12px;
      border-radius: 0;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .card {
      background-color: #fff;
      border-radius: 8px;
      margin: 8px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }
    
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 20px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: #1DA1F2;
    }
    
    input:checked + .slider:before {
      transform: translateX(18px);
    }
    
    .status {
      font-size: 12px;
      font-weight: bold;
    }
    
    .enabled {
      color: #2ecc71;
    }
    
    .disabled {
      color: #e74c3c;
    }
    
    .button-container {
      display: flex;
      justify-content: center;
      margin-top: 8px;
    }
    
    .settings-button {
      background-color: #f8f9fa;
      color: #1DA1F2;
      border: 1px solid #1DA1F2;
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    
    .settings-button:hover {
      background-color: #e8f5fe;
    }
    
    .footer {
      text-align: center;
      padding: 8px;
      color: #657786;
      font-size: 10px;
      border-top: 1px solid #e1e8ed;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      Gemini Reply Generator
    </div>
    
    <div class="card">
      <div class="toggle-container">
        <span>拡張機能</span>
        <div>
          <label class="toggle-switch">
            <input type="checkbox" id="extensionToggle">
            <span class="slider"></span>
          </label>
          <span id="statusText" class="status enabled">有効</span>
        </div>
      </div>
      
      <div class="button-container">
        <a href="options.html" class="settings-button">設定</a>
      </div>
    </div>
    
    <div class="footer">
      v1.0.0
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
